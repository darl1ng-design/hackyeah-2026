services:
  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8082}:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hub}
      DB_USER: ${DB_USER:-hub}
      DB_PASS: ${DB_PASS:-hub}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-set-me}
      LLM_CHAT_BASE_URL: ${LLM_CHAT_BASE_URL:-http://host.docker.internal:8082/v1}
      LLM_EMBED_BASE_URL: ${LLM_EMBED_BASE_URL:-http://host.docker.internal:8081/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  db:
    build:
      context: ./docker
      dockerfile: Dockerfile.pg
    image: hub-pg:latest
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${DB_NAME:-hub}
      POSTGRES_USER: ${DB_USER:-hub}
      POSTGRES_PASSWORD: ${DB_PASS:-hub}
    ports:
      - "${POSTGRES_PORT:-5439}:5432"
    volumes:
      - hub-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hub-pgdata:
