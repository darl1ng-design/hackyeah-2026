name: Build and Push Docker Images

on:
  workflow_dispatch:
    branches:
      - main
      - master
      - janek
  push:
    branches:
      - main

env:
  REGISTRY: code.algoweave.eu
  # Docker image names must be lowercase. We convert this in a step below.
  IMAGE_NAME_RAW: ${{ gitea.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert image name and actor to lowercase
        run: |
          echo "IMAGE_NAME=$(echo ${{ env.IMAGE_NAME_RAW }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "DOCKER_USERNAME=$(echo ${{ gitea.actor }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Self-hosted runner: the buildkit container's local cache grows across
      # runs until 'mvn package' dies with ENOSPC. Registry cache-from makes a
      # local wipe cheap (layers come back from :buildcache, not from scratch).
      - name: Free disk space
        run: |
          df -h / | tail -1
          docker builder prune -af || true
          docker system prune -f || true
          df -h / | tail -1

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # The username must match the owner of the token (the actor), and often must be lowercase.
          username: ${{ env.DOCKER_USERNAME }}
          # Using a dedicated Personal Access Token (PAT) stored as a secret, because gitea.token is failing.
          password: ${{ secrets.TOKEN }}

      # ---- Spring Boot app (REST API, port 8080 in container) ----
      - name: Extract app metadata
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-app
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-app:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-app:buildcache,mode=max

      # ---- Postgres 18 image (pgvector + pg_textsearch BM25 + PL stopwords) ----
      - name: Extract db metadata
        id: meta-db
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-pg
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push db image
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile.pg
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta-db.outputs.tags }}
          labels: ${{ steps.meta-db.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-pg:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-pg:buildcache,mode=max

      # ---- Frontend image (Vite build served by nginx, proxies /api to app) ----
      - name: Extract frontend metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:buildcache,mode=max

      - name: Clean up build cache
        if: always()
        run: |
          docker builder prune -af || true
          docker image prune -f || true