spring:
  application:
    name: hub-app
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hub}
    username: ${DB_USER:hub}
    password: ${DB_PASS:hub}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:set-me}
      chat:
        base-url: ${LLM_CHAT_BASE_URL:http://localhost:8082/v1}
        options:
          model: ${LLM_CHAT_MODEL:qwen3-4b}
          temperature: 0.3
      embedding:
        base-url: ${LLM_EMBED_BASE_URL:http://localhost:8081/v1}
        options:
          model: qwen3-embedding-0.6b
      # Speech-to-text: LiteLLM gateway (api.skalujto.ai) -> faster-whisper on DGX-A.
      audio:
        transcription:
          base-url: ${WHISPER_BASE_URL:https://api.skalujto.ai/v1}
          api-key: ${WHISPER_API_KEY:set-me}
          timeout: 120s
          max-retries: 1
    vectorstore:
      pgvector:
        initialize-schema: true
        # Qwen3-Embedding-0.6B = 1024 dims. Exact search is fine for the library
        # size (~ms); at scale switch index-type to HNSW (1024 < 2000 limit).
        index-type: NONE
        distance-type: COSINE_DISTANCE
        dimensions: 1024

hub:
  transcription:
    model: ${WHISPER_MODEL:whisper-large-v3-turbo}
    per-minute: ${HUB_TRANSCRIBE_PER_MINUTE:10}
    global-per-minute: ${HUB_TRANSCRIBE_GLOBAL_PER_MINUTE:30}
  seed-vectors: true