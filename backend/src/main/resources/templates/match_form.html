<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Zglos problem')}"></head>
<body class="bg-slate-50 text-slate-900">
<header th:replace="~{fragments/layout :: header}"></header>
<main class="max-w-2xl mx-auto px-4 py-10" id="tresc">
    <h1 class="text-3xl font-bold mb-3">Co jest problemem w Twojej okolicy?</h1>
    <p class="mb-6">Napisz zwyklymi slowami, jak do sasiedza. Nie musisz znac rozwiazania —
        nasz system znajdzie podobne przypadki i gotowe innowacje.</p>
    <form class="space-y-5" method="post" th:action="@{/match}">
        <div>
            <label class="block font-bold mb-1" for="description">Opis problemu *</label>
            <textarea class="w-full rounded-lg border border-slate-400 p-3 text-lg" id="description" name="description" placeholder="np. W mojej gminie seniorzy sa samotni, nikt ich nie odwiedza, a sklep jest daleko."
                      required
                      rows="5"></textarea>
        </div>
        <div class="grid md:grid-cols-2 gap-4">
            <div>
                <label class="block font-bold mb-1" for="region">Gmina / powiat</label>
                <input class="w-full rounded-lg border border-slate-400 p-3" id="region" name="region"
                       placeholder="np. gmina Liszki">
            </div>
            <div>
                <label class="block font-bold mb-1" for="authorName">Twoje imie (opcjonalnie)</label>
                <input class="w-full rounded-lg border border-slate-400 p-3" id="authorName" name="authorName">
            </div>
        </div>
        <button class="bg-blue-800 text-white font-bold text-lg px-6 py-3 rounded-lg hover:bg-blue-900" type="submit">
            Znajdz dopasowane rozwiazania
        </button>
    </form>
</main>
</body>
</html>
