<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="pl">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' — Hub Innowacji Spolecznych'">Hub</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root { font-size: 17px; }                       /* wieksza baza dla seniorow */
    .skip-link { position:absolute; left:-9999px; }
    .skip-link:focus { left:1rem; top:1rem; z-index:50; background:#1d4ed8; color:#fff; padding:.5rem 1rem; }
    a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 3px solid #1d4ed8; outline-offset: 2px;
    }
  </style>
</head>
<body>
<header th:fragment="header" class="bg-blue-900 text-white">
  <a href="#tresc" class="skip-link">Przeskocz do tresci</a>
  <nav aria-label="Glowna nawigacja" class="max-w-5xl mx-auto flex flex-wrap items-center gap-4 px-4 py-4">
    <a th:href="@{/}" class="font-bold text-lg">Hub Innowacji Spolecznych</a>
    <a th:href="@{/match}" class="underline decoration-2 underline-offset-4 hover:no-underline">Zglos problem</a>
    <a th:href="@{/wiedza}" class="underline decoration-2 underline-offset-4 hover:no-underline">Zasobnik wiedzy</a>
    <a th:href="@{/pomysly}" class="underline decoration-2 underline-offset-4 hover:no-underline">Pomysly</a>
    <span class="ml-auto flex gap-3 items-center">
      <span sec:authorize="isAuthenticated()" sec:authentication="name" class="text-sm"></span>
      <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" class="underline decoration-2 underline-offset-4">Panel admina</a>
      <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="underline decoration-2 underline-offset-4">Zaloguj</a>
      <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="inline">
        <button type="submit" class="underline decoration-2 underline-offset-4">Wyloguj</button>
      </form>
    </span>
  </nav>
</header>
<main th:fragment="scripts"></main>
</body>
</html>
