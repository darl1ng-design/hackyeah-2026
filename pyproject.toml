[project]
name = "hackyeah"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "openai>=1.60",
    "langfuse>=4.7",
    "numpy>=2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"  # basedpyright default "recommended" floods reportUnknown*
