<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Zasobnik wiedzy')}"></head>
<body class="bg-slate-50 text-slate-900">
<header th:replace="~{fragments/layout :: header}"></header>
<main id="tresc" class="max-w-5xl mx-auto px-4 py-10">
  <h1 class="text-3xl font-bold mb-6">Zasobnik wiedzy</h1>
  <h2 class="text-xl font-bold mb-3">Wyzwania spoleczne Malopolski</h2>
  <ul class="grid md:grid-cols-2 gap-4 mb-10">
    <li th:each="a : ${areas}" class="bg-white rounded-xl shadow p-5 border border-slate-200">
      <h3 class="font-bold" th:text="${a.name}"></h3>
      <p class="text-slate-700 text-sm mt-1" th:text="${a.description}"></p>
    </li>
  </ul>
  <h2 class="text-xl font-bold mb-3">Biblioteka innowacji spolecznych</h2>
  <ul class="grid md:grid-cols-2 gap-4">
    <li th:each="i : ${innovations}" class="bg-white rounded-xl shadow p-5 border border-slate-200">
      <div class="flex justify-between gap-2">
        <h3 class="font-bold" th:text="${i.title}"></h3>
        <span class="text-xs font-bold bg-blue-100 text-blue-900 rounded px-2 py-1 h-fit" th:text="${i.status}"></span>
      </div>
      <p class="text-slate-700 text-sm mt-2" th:text="${i.summary}"></p>
      <p class="text-xs text-slate-600 mt-2">
        <span th:if="${i.area != null}" th:text="${i.area.name}"></span> ·
        <span th:text="${i.region}"></span>
      </p>
    </li>
  </ul>
</main>
</body>
</html>
