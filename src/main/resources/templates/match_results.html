<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dopasowane rozwiazania')}"></head>
<body class="bg-slate-50 text-slate-900">
<header th:replace="~{fragments/layout :: header}"></header>
<main id="tresc" class="max-w-3xl mx-auto px-4 py-10">
  <p class="text-sm text-slate-700 mb-1">Twoje zgloszenie zapisano (nr <span th:text="${report.id}"></span>).
     Obszar: <strong th:text="${report.area != null} ? ${report.area.name} : 'do przypisania'"></strong></p>
  <h1 class="text-3xl font-bold mb-6">Pasujace innowacje spoleczne</h1>
  <div th:if="${results.isEmpty()}" class="bg-amber-100 border border-amber-700 rounded-lg p-4">
    Na razie nie znalazlismy podobnych rozwiazan — Twoje zgloszenie trafilo do zespolu Hubu.
  </div>
  <ol class="space-y-4">
    <li th:each="m, s : ${results}" class="bg-white rounded-xl shadow p-6 border border-slate-200">
      <div class="flex items-baseline justify-between gap-4">
        <h2 class="font-bold text-xl" th:text="${s.count} + '. ' + ${m.innovation.title}"></h2>
        <span class="text-sm text-slate-600 whitespace-nowrap" th:text="'podobienstwo: ' + ${#numbers.formatDecimal(m.score * 100, 1, 0)} + '%'"></span>
      </div>
      <p class="mt-2 text-blue-900" th:text="${m.why}"></p>
      <p class="mt-2 text-slate-700" th:text="${m.innovation.summary}"></p>
      <p class="mt-2 text-sm text-slate-600">
        Grupa: <span th:text="${m.innovation.targetGroup}"></span> ·
        Region: <span th:text="${m.innovation.region}"></span> ·
        Status: <strong th:text="${m.innovation.status}"></strong>
      </p>
    </li>
  </ol>
  <div class="mt-8 flex gap-4">
    <a th:href="@{/match}" class="text-blue-800 underline decoration-2 underline-offset-4 font-bold">&larr; Zglos inny problem</a>
    <a th:href="@{/pomysly}" class="text-blue-800 underline decoration-2 underline-offset-4 font-bold">Mam wlasny pomysl &rarr;</a>
  </div>
</main>
</body>
</html>
