spring:
  application:
    name: hub-app
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hub}
    username: ${DB_USER:hub}
    password: ${DB_PASS:hub}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:set-me}
      chat:
        base-url: ${LLM_CHAT_BASE_URL:http://localhost:8082/v1}
        options:
          model: qwen3-4b
          temperature: 0.3
      embedding:
        base-url: ${LLM_EMBED_BASE_URL:http://localhost:8081/v1}
        options:
          model: qwen3-embedding-4b
    vectorstore:
      pgvector:
        initialize-schema: true
        # Qwen3-Embedding-4B = 2560 dims > pgvector HNSW limit (2000). Exact search is
        # fine for the library size; for scale, use the 0.6B model (1024 dims) + HNSW.
        index-type: NONE
        distance-type: COSINE_DISTANCE
        dimensions: 2560

hub:
  seed-vectors: true